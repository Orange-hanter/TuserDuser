# This file acted as a full-stack compose reference but duplicated
# the `event-api` and `telegram-service` compose files present in the
# repository. Docker Compose doesn't support in-YAML includes, so instead
# we provide a tiny wrapper script that launches the stack by merging
# the existing compose files.
#
# Use the script `scripts/up-full.sh` to start the full stack (recommended):
#
#   ./scripts/up-full.sh
#
# Or run docker compose combining files manually:
#
#   docker compose -f event-api/docker-compose.yml -f telegram-service/docker-compose.yml up -d

# NOTE: Keep this file as a reference only. The real service definitions
# live in `event-api/docker-compose.yml` and `telegram-service/docker-compose.yml`.
