name: Delivery

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  SERVICE_NAME: event-api
  REMOTE_BINARY_PATH: /opt/event-api/bin/event-api
  REMOTE_OWNER: eventapi
  REMOTE_GROUP: eventapi
  HEALTHCHECK_URL: https://api.tuserduser.online/health
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build Linux binary
        run: |
          cd event-api
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/event-api ./cmd/server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: event-api-linux-amd64
          path: event-api/dist/event-api
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Staging
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: event-api-linux-amd64
          path: dist

      - name: Copy binary to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          source: dist/event-api
          target: /tmp/

      - name: Run install script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            bash /opt/event-api/scripts/install.sh "${{ env.SERVICE_NAME }}" "${{ env.REMOTE_BINARY_PATH }}" "${{ env.HEALTHCHECK_URL }}"
