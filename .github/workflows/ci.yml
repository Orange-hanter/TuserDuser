name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop, mvp ]
  pull_request:
    branches: [ master, main, develop, mvp ]

env:
  GO_VERSION: '1.22'

jobs:
  # Job 1: Lint and check code for both backends
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [ event-api, Support/Backend ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.service }}-${{ hashFiles(format('{0}/go.sum', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.service }}-

      - name: Run golangci-lint on ${{ matrix.service }}
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.service }}
          args: --timeout=5m

      - name: Check Go formatting on ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted in ${{ matrix.service }}. Run: gofmt -s -w ."
            gofmt -s -l .
            exit 1
          fi
          echo "✅ Code is properly formatted in ${{ matrix.service }}"

      - name: Go vet on ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          go vet ./...

  # Job 2: Run tests for both backends
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        service: [ event-api, Support/Backend ]
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.service }}-${{ hashFiles(format('{0}/go.sum', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.service }}-

      - name: Download dependencies for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          go mod download
          go mod verify

      - name: Run tests on ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: event_api_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Generate coverage report for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ${{ matrix.service }}/coverage.out
          flags: unittests-${{ matrix.service }}
          name: codecov-${{ matrix.service }}
          fail_ci_if_error: false

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.out

  # Job 3: Build binaries
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        service: [ event-api, Support/Backend ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build ${{ matrix.service }} (darwin/arm64)
        run: |
          cd ${{ matrix.service }}
          GOOS=darwin GOARCH=arm64 go build -o ../bin/${{ matrix.service }}-darwin-arm64 ./cmd/server || go build -o ../bin/${{ matrix.service }}-darwin-arm64 ./

      - name: Build ${{ matrix.service }} (linux/amd64)
        run: |
          cd ${{ matrix.service }}
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ../bin/${{ matrix.service }}-linux-amd64 ./cmd/server || go build -o ../bin/${{ matrix.service }}-linux-amd64 ./

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.service }}
          path: bin/${{ matrix.service }}-*

  # Job 4: Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run GoSec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./event-api/... ./Support/Backend/...'

      - name: Upload GoSec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'gosec-results.sarif'

  # Job 5: Deploy (only for master/main branch)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-domain.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment placeholder
        run: |
          echo "🚀 Deploy step - configure your deployment method"
          echo "📦 Artifacts available for deployment"
          echo "🌍 Environment: production"
          echo ""
          echo "To configure deployment:"
          echo "  1. Set up SSH deployment via appleboy/ssh-action"
          echo "  2. Use docker-compose or Kubernetes manifests"
          echo "  3. Add required secrets in GitHub repository settings"
