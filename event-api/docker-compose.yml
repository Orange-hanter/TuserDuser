services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: event_api_postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: ${DB_USER:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
      POSTGRES_DB: ${DB_NAME:-event_api}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    
    ports:
      - "${DB_PORT:-5432}:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - event_api_network
  
  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: event_api_pgadmin
    restart: unless-stopped
    
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    
    ports:
      - "5050:80"
    
    depends_on:
      - postgres
    
    networks:
      - event_api_network

volumes:
  postgres_data:
    driver: local

networks:
  event_api_network:
    driver: bridge
