services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: event_api_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
      POSTGRES_DB: ${DB_NAME:-event_api}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - event_api_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: event_api_redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-devpass}

    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - event_api_network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: event_api_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - event_api_network

  # ============================================
  # MONITORING STACK (OpenTelemetry + Grafana)
  # ============================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: event_api_prometheus
    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - event_api_network

    depends_on:
      - otel-collector

  # Loki - Log Storage
  loki:
    image: grafana/loki:2.9.0
    container_name: event_api_loki
    restart: always

    ports:
      - "3100:3100"

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

    command: -config.file=/etc/loki/config.yml

    networks:
      - event_api_network

  # Tempo - Distributed Tracing
  tempo:
    image: grafana/tempo:latest
    container_name: event_api_tempo
    restart: always

    ports:
      - "3200:3200"

    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo

    command: -config.file=/etc/tempo.yml

    networks:
      - event_api_network

  # OpenTelemetry Collector - Central Telemetry Hub
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: event_api_otel_collector
    restart: always

    command: ["--config=/etc/otel-collector.yml"]

    ports:
      - "4317:4317" # gRPC OTLP
      - "4318:4318" # HTTP OTLP
      - "8889:8889" # Prometheus exporter

    volumes:
      - ./monitoring/otel/otel-collector.yml:/etc/otel-collector.yml:ro

    networks:
      - event_api_network

    depends_on:
      - loki
      - tempo

  # Grafana - Visualization & Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: event_api_grafana
    restart: always

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - event_api_network

    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data:
  redis_data:
    driver: local
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  event_api_network:
    driver: bridge
