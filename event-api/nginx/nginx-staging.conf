# Production-ready Nginx configuration for staging environment
# Bare-metal deployment - TuserDuser staging
#
# DEPLOYMENT INSTRUCTIONS:
# 1. Place this file in /etc/nginx/sites-available/staging
# 2. Disable default site: sudo rm /etc/nginx/sites-enabled/default
# 3. Enable staging site: sudo ln -s /etc/nginx/sites-available/staging /etc/nginx/sites-enabled/staging
# 4. Test configuration: sudo nginx -t
# 5. Reload nginx: sudo systemctl reload nginx
#
# PREREQUISITES:
# - Let's Encrypt certificates installed at /etc/letsencrypt/live/staging.tuserduser.online/
# - React SPA built and placed at /var/www/staging-frontend/build/
# - Go backend running on 127.0.0.1:8080
# - Log directories: /var/log/nginx/ (writable by www-data)
#
# This configuration overrides the default nginx site to serve your applications

# Upstream definition for Go backend API
upstream backend_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limiting zone for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# Custom log format for API with response times and upstream status
log_format api_format '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time '
                     'ust=$upstream_status';

# HTTP Server - staging.tuserduser.online (Redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name staging.tuserduser.online;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTP Server - tuserduser.online (Redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name tuserduser.online;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTP Server - api.tuserduser.online (Redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name api.tuserduser.online;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server - staging.tuserduser.online (React SPA)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.tuserduser.online www.staging.tuserduser.online;

    # SSL Certificate (Let's Encrypt - SAN certificate for all domains)
    ssl_certificate /etc/letsencrypt/live/staging.tuserduser.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.tuserduser.online/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy (Report-Only mode for SPA)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.tuserduser.online; frame-ancestors 'self';" always;

    # Root directory for React SPA
    root /var/www/event-app-v2/staging/current;
    index index.html;

    # Logging (buffered to reduce I/O)
    access_log /var/log/nginx/staging-access.log combined buffer=8k;
    error_log /var/log/nginx/staging-error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static assets with immutable cache (hashed filenames)
    # Match static assets: /static/* and hashed files in root (e.g., main.abc123.js)
    location ~* ^/static/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    
    # Hashed assets in root directory (React build output)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Explicitly handle index.html with no-cache (exact match has higher priority)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # API proxy - forward /v1/api/* to backend
    location /v1/api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy to Go backend
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Root and SPA routes - no cache, fallback to index.html
    location / {
        # Disable caching for HTML files and root route
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Try to serve the file, if not found, serve index.html (SPA routing)
        try_files $uri $uri/ /index.html;
    }
}

