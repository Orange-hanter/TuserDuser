groups:
  - name: event-api
    interval: 30s
    rules:
      - alert: HighRedisMemoryUsage
        expr: redis_memory_usage_bytes > 1073741824
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ humanize $value }} bytes"

      - alert: RedisCommandErrors
        expr: rate(redis_command_errors_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Redis command error rate"
          description: "Error rate: {{ $value | humanizePercentage }}"

      - alert: HighDiscoveryQueueErrorRate
        expr: discovery_queue_error_rate > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High discovery queue error rate"
          description: "Queue: {{ $labels.queue_name }}, Error rate: {{ $value | humanizePercentage }}"

      - alert: APIServerDown
        expr: up{job="event-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API server is down"
          description: "Event API server {{ $labels.instance }} is down"

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Loki is down"
          description: "Loki instance {{ $labels.instance }} is down"
