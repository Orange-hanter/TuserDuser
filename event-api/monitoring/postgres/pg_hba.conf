## pg_hba.conf for local docker development
# This file is mounted into the Postgres container to allow connections
# from Docker networks used in local compose setups.

# Allow docker network access (covers 172.16.0.0 - 172.31.255.255)
host    all             all             172.16.0.0/12            trust

# Default local rules (keep safe defaults for local sockets and localhost)
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# NOTE:
# - Using `trust` is acceptable for local development only. Do NOT use
#   this in production. For production use `md5`/`scram-sha-256` and
#   limit allowed addresses.

# Temporary: allow all hosts from local/dev network to connect (broad rule)
# This covers cases where Docker Desktop NATs host addresses; remove/replace
# with stricter rules for production.
host    all             all             0.0.0.0/0               trust
