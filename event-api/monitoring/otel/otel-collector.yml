receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  resource:
    attributes:
      - key: service.name
        action: upsert
        value: event-api

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: event_api

  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  file:
    path: /var/log/agent/otel-logs.jsonl
  file/traces:
    path: /var/log/agent/otel-traces.jsonl

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus]

    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/tempo, file/traces]

    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [file]

  telemetry:
    logs:
      level: info
