definitions:
  discovery.BookingResult:
    properties:
      bookedEvent:
        $ref: '#/definitions/discovery.Event'
      conflictedEventIds:
        items:
          type: string
        type: array
    type: object
  discovery.ConflictFlag:
    properties:
      activatedAt:
        type: string
      active:
        type: boolean
      bookedEvent:
        type: string
      reason:
        type: string
    type: object
  discovery.Event:
    properties:
      description:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: {}
        description: unstructured, user-defined. Prefer typed fields for core logic.
        type: object
      slot:
        $ref: '#/definitions/discovery.TimeSlot'
      title:
        type: string
    type: object
  discovery.HistoryEntry:
    properties:
      action:
        $ref: '#/definitions/discovery.UserAction'
      context:
        additionalProperties: {}
        type: object
      eventId:
        type: string
      timestamp:
        type: string
      userId:
        type: string
    type: object
  discovery.NextEvent:
    properties:
      conflict:
        type: boolean
      conflictFlag:
        $ref: '#/definitions/discovery.ConflictFlag'
      event:
        $ref: '#/definitions/discovery.Event'
      remainingConflicts:
        type: integer
      remainingPrimary:
        type: integer
    type: object
  discovery.TimeSlot:
    properties:
      end:
        type: string
      start:
        type: string
    type: object
  discovery.UserAction:
    enum:
    - like
    - dislike
    - neutral
    - book
    type: string
    x-enum-varnames:
    - ActionLike
    - ActionDislike
    - ActionNeutral
    - ActionBook
  models.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.CreateEventRequest:
    properties:
      details:
        additionalProperties: true
        type: object
      duration:
        type: integer
      end:
        type: string
      needReg:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      start:
        type: string
      type:
        type: string
    required:
    - duration
    - end
    - priceType
    - start
    - type
    type: object
  models.DiscoveryActionRequest:
    properties:
      action:
        description: Action accepts "like", "dislike" or "neutral" and must match
          the current event.
        example: like
        type: string
      eventId:
        description: EventID is the identifier of the event returned by GET /next.
        example: evt_123
        type: string
    type: object
  models.DiscoveryBookRequest:
    properties:
      eventId:
        description: EventID points to the event that should be booked.
        example: evt_123
        type: string
    type: object
  models.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  models.Event:
    properties:
      details:
        additionalProperties: true
        type: object
      duration:
        type: integer
      end:
        type: string
      id:
        type: string
      needReg:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      start:
        type: string
      time:
        type: string
      type:
        type: string
    type: object
  models.EventSubscription:
    properties:
      event_id:
        example: evt_xyz
        type: string
      expires_at:
        description: Nullable
        example: "2025-11-21T15:30:00Z"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.SubscriptionStatus'
        example: confirmed
      subscribed_at:
        example: "2025-11-20T15:30:00Z"
        type: string
    type: object
  models.EventWithSubscription:
    properties:
      attendance_status:
        description: '"attended", "no_show", "cancelled"'
        example: attended
        type: string
      details:
        additionalProperties: true
        type: object
      duration:
        type: integer
      end:
        type: string
      id:
        type: string
      needReg:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      start:
        type: string
      subscribed_at:
        example: "2025-11-20T15:30:00Z"
        type: string
      subscription_status:
        allOf:
        - $ref: '#/definitions/models.SubscriptionStatus'
        example: confirmed
      time:
        type: string
      type:
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.LogoutRequest:
    properties:
      token:
        type: string
    type: object
  models.PendingEvent:
    properties:
      details:
        additionalProperties: true
        type: object
      duration:
        type: integer
      end:
        type: string
      id:
        type: string
      needReg:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      reviewComment:
        type: string
      reviewedAt:
        type: string
      start:
        type: string
      status:
        type: string
      time:
        type: string
      type:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      verification_type:
        description: '"email", "sms", "both" (default: "both")'
        type: string
    required:
    - email
    - password
    - phone
    type: object
  models.ReviewEventRequest:
    properties:
      action:
        type: string
      comment:
        type: string
    required:
    - action
    type: object
  models.SubscribeRequest:
    properties:
      metadata:
        additionalProperties:
          type: string
        example:
          dietary_preferences: vegan
        type: object
    type: object
  models.SubscriptionStatus:
    enum:
    - confirmed
    - waitlisted
    - cancelled
    type: string
    x-enum-varnames:
    - SubscriptionStatusConfirmed
    - SubscriptionStatusWaitlisted
    - SubscriptionStatusCancelled
  models.TelegramInfo:
    properties:
      chat_id:
        example: 123456789
        type: integer
      status:
        example: active
        type: string
      username:
        example: ivan_tg
        type: string
    type: object
  models.UpdateRoleRequest:
    properties:
      role:
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
      verified:
        type: boolean
    type: object
  models.UserProfile:
    properties:
      created_at:
        example: "2025-01-10T08:30:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: usr_abc
        type: string
      name:
        example: Иван Петров
        type: string
      telegram_info:
        $ref: '#/definitions/models.TelegramInfo'
      telegram_registered:
        example: true
        type: boolean
    type: object
  models.VerifyRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API для управления событиями и аутентификации пользователей
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Event API
  version: "1.0"
paths:
  /api/users/me:
    get:
      consumes:
      - application/json
      description: Returns full user profile and status flags.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
  /api/users/me/events/{event_id}/subscribe:
    post:
      consumes:
      - application/json
      description: Idempotent subscription endpoint. Checks capacity and handles waitlisting.
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      - description: Subscription metadata
        in: body
        name: request
        schema:
          $ref: '#/definitions/models.SubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Already subscribed
          schema:
            $ref: '#/definitions/models.EventSubscription'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EventSubscription'
        "202":
          description: Waitlisted
          schema:
            $ref: '#/definitions/models.EventSubscription'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Event full
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Subscribe to an event
      tags:
      - users
  /api/users/me/events/history:
    get:
      consumes:
      - application/json
      description: Returns attended or missed past events.
      parameters:
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EventWithSubscription'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get event history
      tags:
      - users
  /api/users/me/events/upcoming:
    get:
      consumes:
      - application/json
      description: Returns events the user is currently subscribed to (confirmed participation).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EventWithSubscription'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get upcoming events
      tags:
      - users
  /health:
    get:
      description: Возвращает статус OK если сервис работает
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Проверка здоровья сервиса
      tags:
      - health
  /v1/api/admin/users:
    get:
      description: Возвращает список всех пользователей системы
      produces:
      - application/json
      responses:
        "200":
          description: Список пользователей
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить список всех пользователей
      tags:
      - admin
  /v1/api/admin/users/role:
    put:
      consumes:
      - application/json
      description: 'Назначает пользователю одну из ролей: `user`, `creator`, `support`,
        `admin`. Только для администраторов.'
      parameters:
      - description: 'Данные для обновления роли (role: user|creator|support|admin)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленный пользователь
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Неверный формат запроса или недопустимая роль
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить роль пользователя
      tags:
      - admin
  /v1/api/auth/login:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя и возвращает JWT токены
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная аутентификация
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Вход в систему
      tags:
      - auth
  /v1/api/auth/logout:
    post:
      consumes:
      - application/json
      description: Инвалидирует refresh токен пользователя
      parameters:
      - description: Refresh токен для инвалидации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный выход
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Выход из системы
      tags:
      - auth
  /v1/api/auth/me:
    get:
      description: 'Возвращает данные текущего авторизованного пользователя с информацией
        о статусе регистрации в Telegram и ролью пользователя (role: user|creator|support|admin)'
      produces:
      - application/json
      responses:
        "200":
          description: 'Информация о пользователе с полями: user (models.User), role
            (string), telegram_registered (bool), telegram_info (object, опционально)'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить информацию о текущем пользователе
      tags:
      - auth
  /v1/api/auth/register:
    post:
      consumes:
      - application/json
      description: 'Создает нового пользователя и отправляет код верификации через
        email и/или SMS (в зависимости от verification_type: "email", "sms", "both")'
      parameters:
      - description: 'Данные для регистрации (verification_type опционален: email/sms/both,
          по умолчанию both)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: user:models.User, verify_code:string
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Пользователь уже существует
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - auth
  /v1/api/auth/verify:
    post:
      consumes:
      - application/json
      description: Проверяет код верификации для подтверждения email и возвращает
        JWT токен
      parameters:
      - description: Код верификации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email верифицирован, токен выдан
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Неверный код или формат запроса
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Верификация email
      tags:
      - auth
  /v1/api/discovery/action:
    post:
      consumes:
      - application/json
      description: Обрабатывает действия like/dislike/neutral для текущего события
        в очереди
      parameters:
      - description: Действие пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DiscoveryActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/discovery.HistoryEntry'
        "400":
          description: Некорректные данные
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Нет авторизации
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Событие не найдено
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Конфликт очереди
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправить реакцию на событие
      tags:
      - discovery
  /v1/api/discovery/book:
    post:
      consumes:
      - application/json
      description: Подтверждает участие в текущем событии, откладывая конфликтующие
        события в конец очереди
      parameters:
      - description: Запрос на бронирование
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DiscoveryBookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/discovery.BookingResult'
        "400":
          description: Некорректные данные
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Нет авторизации
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Событие не найдено
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Конфликт очереди
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Забронировать событие
      tags:
      - discovery
  /v1/api/discovery/history:
    get:
      description: Возвращает детальную историю действий discovery-движка для пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/discovery.HistoryEntry'
            type: array
        "401":
          description: Нет авторизации
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: История действий пользователя
      tags:
      - discovery
  /v1/api/discovery/next:
    get:
      description: Возвращает следующее событие в очереди с учетом бронирований, конфликтов
        и фильтров
      parameters:
      - description: Типы событий через запятую
        example: '"Конференция,Мастер-класс"'
        in: query
        name: types
        type: string
      - description: Типы цен через запятую
        example: '"free,paid"'
        in: query
        name: priceTypes
        type: string
      - description: Места проведения (поиск по подстроке)
        example: '"Коворкинг"'
        in: query
        name: places
        type: string
      - description: Начало диапазона дат (RFC3339)
        example: '"2025-01-01T00:00:00Z"'
        in: query
        name: dateFrom
        type: string
      - description: Конец диапазона дат (RFC3339)
        example: '"2025-12-31T23:59:59Z"'
        in: query
        name: dateTo
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/discovery.NextEvent'
        "401":
          description: Нет авторизации
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Очередь пуста
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Конфликт действий
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить следующее событие окна
      tags:
      - discovery
  /v1/api/events:
    post:
      consumes:
      - application/json
      description: Создает новое событие
      parameters:
      - description: Данные события
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Событие, отправленное на модерацию
          schema:
            $ref: '#/definitions/models.PendingEvent'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Создать событие
      tags:
      - events
  /v1/api/events/{id}:
    delete:
      description: Удаляет событие по ID
      parameters:
      - description: ID события
        in: path
