definitions:
  discovery.BookingResult:
    properties:
      bookedEvent:
        $ref: '#/definitions/discovery.Event'
      conflictedEventIds:
        items:
          type: string
        type: array
    type: object
  discovery.ConflictFlag:
    properties:
      activatedAt:
        type: string
      active:
        type: boolean
      bookedEvent:
        type: string
      reason:
        type: string
    type: object
  discovery.Event:
    properties:
      description:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: {}
        description: unstructured, user-defined. Prefer typed fields for core logic.
        type: object
      slot:
        $ref: '#/definitions/discovery.TimeSlot'
      title:
        type: string
    type: object
  discovery.HistoryEntry:
    properties:
      action:
        $ref: '#/definitions/discovery.UserAction'
      context:
        additionalProperties: {}
        type: object
      eventId:
        type: string
      timestamp:
        type: string
      userId:
        type: string
    type: object
  discovery.NextEvent:
    properties:
      conflict:
        type: boolean
      conflictFlag:
        $ref: '#/definitions/discovery.ConflictFlag'
      event:
        $ref: '#/definitions/discovery.Event'
      remainingConflicts:
        type: integer
      remainingPrimary:
        type: integer
    type: object
  discovery.TimeSlot:
    properties:
      end:
        type: string
      start:
        type: string
    type: object
  discovery.UserAction:
    enum:
    - like
    - dislike
    - neutral
    - book
    type: string
    x-enum-varnames:
    - ActionLike
    - ActionDislike
    - ActionNeutral
    - ActionBook
  models.AddReviewCommentRequest:
    properties:
      comment:
        type: string
      eventId:
        type: string
    required:
    - comment
    - eventId
    type: object
  models.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.BlockEventRequest:
    properties:
      eventId:
        type: string
      reason:
        type: string
    required:
    - eventId
    - reason
    type: object
  models.BlockedEvent:
    properties:
      blockReason:
        type: string
      blockedAt:
        type: string
      createdAt:
        type: string
      details:
        additionalProperties: {}
        type: object
      duration:
        type: integer
      endTime:
        type: string
      id:
        type: string
      needRegistration:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      reviewComment:
        type: string
      startTime:
        type: string
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  models.CheckUserExistsRequest:
    properties:
      email:
        type: string
      phone:
        type: string
    type: object
  models.CheckUserExistsResponse:
    properties:
      conflict_type:
        description: '"email", "phone", "both"'
        type: string
      exists:
        type: boolean
      message:
        type: string
    type: object
  models.CreateEventRequest:
    properties:
      details:
        additionalProperties: true
        type: object
      duration:
        type: integer
      end:
        type: string
      needReg:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      start:
        type: string
      type:
        type: string
    required:
    - duration
    - end
    - priceType
    - start
    - type
    type: object
  models.CreatorEvent:
    properties:
      createdAt:
        type: string
      details:
        additionalProperties: {}
        type: object
      duration:
        type: integer
      endTime:
        type: string
      id:
        type: string
      needRegistration:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      reviewComment:
        type: string
      startTime:
        type: string
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  models.CreatorEventsResponse:
    properties:
      active:
        description: Одобренные и еще не прошедшие
        items:
          $ref: '#/definitions/models.CreatorEvent'
        type: array
      pending:
        description: Ожидающие проверки
        items:
          $ref: '#/definitions/models.CreatorEvent'
        type: array
      rejected:
        description: Отклонённые
        items:
          $ref: '#/definitions/models.CreatorEvent'
        type: array
    type: object
  models.DiscoveryActionRequest:
    properties:
      action:
        description: Action accepts "like", "dislike" or "neutral" and must match
          the current event.
        example: like
        type: string
      eventId:
        description: EventID is the identifier of the event returned by GET /next.
        example: evt_123
        type: string
    type: object
  models.DiscoveryBookRequest:
    properties:
      eventId:
        description: EventID points to the event that should be booked.
        example: evt_123
        type: string
    type: object
  models.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  models.Event:
    properties:
      details:
        additionalProperties: true
        type: object
      duration:
        type: integer
      end:
        type: string
      id:
        type: string
      needReg:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      start:
        type: string
      time:
        type: string
      type:
        type: string
    type: object
  models.EventSubscription:
    properties:
      event_id:
        example: evt_xyz
        type: string
      expires_at:
        description: Nullable
        example: "2025-11-21T15:30:00Z"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.SubscriptionStatus'
        example: confirmed
      subscribed_at:
        example: "2025-11-20T15:30:00Z"
        type: string
    type: object
  models.EventWithSubscription:
    properties:
      attendance_status:
        description: '"attended", "no_show", "cancelled"'
        example: attended
        type: string
      details:
        additionalProperties: true
        type: object
      duration:
        type: integer
      end:
        type: string
      id:
        type: string
      needReg:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      start:
        type: string
      subscribed_at:
        example: "2025-11-20T15:30:00Z"
        type: string
      subscription_status:
        allOf:
        - $ref: '#/definitions/models.SubscriptionStatus'
        example: confirmed
      time:
        type: string
      type:
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.LogoutRequest:
    properties:
      token:
        type: string
    type: object
  models.Participant:
    properties:
      avatar_url:
        example: https://example.com/avatar.jpg
        type: string
      public_name:
        example: Иван Петров
        type: string
      status:
        description: '"confirmed", "waitlisted", "cancelled"'
        example: confirmed
        type: string
      user_id:
        example: 941b955e-ea57-dee3-565f-5684f81c4f14
        type: string
    type: object
  models.PendingEvent:
    properties:
      details:
        additionalProperties: true
        type: object
      duration:
        type: integer
      end:
        type: string
      id:
        type: string
      needReg:
        type: boolean
      place:
        type: string
      priceType:
        type: string
      reviewComment:
        type: string
      reviewedAt:
        type: string
      start:
        type: string
      status:
        type: string
      time:
        type: string
      type:
        type: string
    type: object
  models.PublicUserProfile:
    properties:
      avatarUrl:
        example: https://cdn.example.com/avatars/941b...jpg
        type: string
      bio:
        example: Организатор мероприятий, спикер
        type: string
      city:
        example: Москва
        type: string
      country:
        example: RU
        type: string
      createdAt:
        example: "2024-05-02T15:23:45Z"
        type: string
      displayName:
        example: Иван Иванов
        type: string
      id:
        example: 941b955e-ea57-dee3-565f-5684f81c4f14
        type: string
      isVerified:
        example: true
        type: boolean
      publicEventsCount:
        example: 12
        type: integer
      socialLinks:
        additionalProperties:
          type: string
        example:
          telegram: https://t.me/ivan
          twitter: https://twitter.com/ivan
        type: object
      updatedAt:
        example: "2025-11-01T12:10:00Z"
        type: string
      username:
        example: ivanivanov
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        description: Опционально, если не указан - отправляем нуль
        type: string
      verification_type:
        description: '"email", "sms", "both" (default: "both")'
        type: string
    required:
    - email
    - password
    type: object
  models.ResendCodeRequest:
    properties:
      email:
        type: string
      verification_type:
        description: '"email", "telegram", "sms"'
        type: string
    required:
    - email
    - verification_type
    type: object
  models.ResendCodeResponse:
    properties:
      expires_in:
        description: Время действия кода в секундах
        type: integer
      message:
        type: string
      retry_after:
        description: Для rate limit ошибок
        type: integer
      verify_code:
        description: Только в dev режиме
        type: string
    type: object
  models.ReviewComment:
    properties:
      authorId:
        type: string
      authorRole:
        type: string
      comment:
        type: string
      createdAt:
        type: string
      eventId:
        type: string
      id:
        type: integer
    type: object
  models.ReviewEventRequest:
    properties:
      action:
        type: string
      comment:
        type: string
    required:
    - action
    type: object
  models.RoleRequest:
    properties:
      reason:
        maxLength: 500
        minLength: 10
        type: string
      role:
        enum:
        - creator
        - support
        type: string
    required:
    - reason
    - role
    type: object
  models.RoleRequestApprovalRequest:
    properties:
      notes:
        maxLength: 500
        type: string
      request_id:
        type: string
    required:
    - request_id
    type: object
  models.RoleRequestRejectionRequest:
    properties:
      reason:
        maxLength: 500
        minLength: 10
        type: string
      request_id:
        type: string
    required:
    - reason
    - request_id
    type: object
  models.RoleRequestResponse:
    properties:
      message:
        type: string
      status:
        description: '"pending", "approved", "rejected"'
        type: string
    type: object
  models.RoleRequestStatus:
    properties:
      created_at:
        example: "2025-11-20T15:30:00Z"
        type: string
      id:
        example: req_123
        type: string
      reason:
        example: Хочу создавать события
        type: string
      requested_role:
        example: creator
        type: string
      review_notes:
        example: Approved
        type: string
      reviewed_at:
        example: "2025-11-21T10:30:00Z"
        type: string
      reviewed_by:
        example: admin_user_id
        type: string
      status:
        description: '"pending", "approved", "rejected"'
        example: pending
        type: string
      updated_at:
        example: "2025-11-21T10:30:00Z"
        type: string
    type: object
  models.RoleRequestsListResponse:
    properties:
      requests:
        items:
          $ref: '#/definitions/models.RoleRequestStatus'
        type: array
      total:
        type: integer
    type: object
  models.SubscribeRequest:
    properties:
      metadata:
        additionalProperties:
          type: string
        example:
          dietary_preferences: vegan
        type: object
    type: object
  models.SubscriptionStatus:
    enum:
    - confirmed
    - waitlisted
    - cancelled
    type: string
    x-enum-varnames:
    - SubscriptionStatusConfirmed
    - SubscriptionStatusWaitlisted
    - SubscriptionStatusCancelled
  models.TelegramInfo:
    properties:
      chat_id:
        example: 123456789
        type: integer
      status:
        example: active
        type: string
      username:
        example: ivan_tg
        type: string
    type: object
  models.UpdateRoleRequest:
    properties:
      role:
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
      verified:
        type: boolean
    type: object
  models.UserProfile:
    properties:
      created_at:
        example: "2025-01-10T08:30:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: usr_abc
        type: string
      name:
        example: Иван Петров
        type: string
      phone:
        example: "+1234567890"
        type: string
      telegram_info:
        $ref: '#/definitions/models.TelegramInfo'
      telegram_registered:
        example: true
        type: boolean
    type: object
  models.VerifyRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API для управления событиями и аутентификации пользователей
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Event API
  version: "1.0"
paths:
  /api/admin/role-requests/{requestId}/approve:
    post:
      consumes:
      - application/json
      description: Approve a pending role request (admin only).
      parameters:
      - description: Approval request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RoleRequestApprovalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: message and status
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve role request
      tags:
      - admin
  /api/admin/role-requests/{requestId}/reject:
    post:
      consumes:
      - application/json
      description: Reject a pending role request (admin only).
      parameters:
      - description: Rejection request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RoleRequestRejectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: message and status
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reject role request
      tags:
      - admin
  /api/admin/role-requests/pending:
    get:
      consumes:
      - application/json
      description: Get all pending role requests (admin only).
      parameters:
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RoleRequestsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get pending role requests
      tags:
      - admin
  /api/events/{event_id}/participants:
    get:
      consumes:
      - application/json
      description: Returns a list of confirmed participants for a specific event.
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Participant'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get event participants
      tags:
      - events
  /api/users/me:
    get:
      consumes:
      - application/json
      description: Returns full user profile and status flags.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
  /api/users/me/events/{event_id}/subscribe:
    post:
      consumes:
      - application/json
      description: Idempotent subscription endpoint. Checks capacity and handles waitlisting.
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      - description: Subscription metadata
        in: body
        name: request
        schema:
          $ref: '#/definitions/models.SubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Already subscribed
          schema:
            $ref: '#/definitions/models.EventSubscription'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EventSubscription'
        "202":
          description: Waitlisted
          schema:
            $ref: '#/definitions/models.EventSubscription'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Event full
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Subscribe to an event
      tags:
      - users
  /api/users/me/events/history:
    get:
      consumes:
      - application/json
      description: Returns attended or missed past events.
      parameters:
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EventWithSubscription'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get event history
      tags:
      - users
  /api/users/me/events/upcoming:
    get:
      consumes:
      - application/json
      description: Returns events the user is currently subscribed to (confirmed participation).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EventWithSubscription'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get upcoming events
      tags:
      - users
  /api/users/public/{userId}:
    get:
      consumes:
      - application/json
      description: Returns public information about a user by their UUID. Does not
        require authentication.
      parameters:
      - description: User ID (UUID format)
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Public user profile
          schema:
            $ref: '#/definitions/models.PublicUserProfile'
        "304":
          description: Not Modified - resource unchanged since last request
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found or profile is private
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get public user profile
      tags:
      - users
  /api/users/request-role:
    post:
      consumes:
      - application/json
      description: User requests a role upgrade (creator, support, etc.) with a reason.
      parameters:
      - description: Role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RoleRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Request role upgrade
      tags:
      - users
  /api/users/request-role/all:
    get:
      consumes:
      - application/json
      description: Get all role requests for the current user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.RoleRequestStatus'
            type: array
