run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck        # Проверка обработки ошибок
    - gosimple        # Упрощение кода
    - govet           # Стандартный vet
    - ineffassign     # Неиспользуемые присваивания
    - staticcheck     # Множество проверок
    - unused          # Неиспользуемый код
    - typecheck       # Проверка типов
    - gofmt           # Форматирование
    - goimports       # Импорты
    - misspell        # Опечатки в комментариях
    - revive          # Замена golint
    - bodyclose       # HTTP response body закрыт
    - gosec           # Безопасность
    - unconvert       # Ненужные преобразования типов
    - gocritic        # Множество проверок качества кода
    - godot           # Точки в комментариях
    - prealloc        # Предаллокация слайсов
    - exportloopref   # Ошибки с переменными в циклах
    - noctx           # Проверка context.Context

  disable:
    - varcheck        # Deprecated
    - structcheck     # Deprecated
    - deadcode        # Deprecated
    - ifshort         # Deprecated

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    disable:
      - shadow

  revive:
    rules:
      - name: exported
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"

  gofmt:
    simplify: true

  goimports:
    local-prefixes: event-api

  misspell:
    locale: US

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G404  # Use of weak random number generator
      - G304  # File path provided as input

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - commentFormatting
      - whyNoLint
      - unnamedResult

  godot:
    scope: declarations
    capital: false

issues:
  exclude-rules:
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - gosec
        - gocritic
        - errcheck
        - bodyclose

    # Exclude known linters from partially hard-vendored code
    - path: internal/migrations/
      linters:
        - gocritic
        - gosec

  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
